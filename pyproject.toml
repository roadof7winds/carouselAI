[project]
name = "carouselai"
version = "0.1.0"
description = "Telegram bot + web editor + MCP server for generating and editing Instagram carousel slides"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pillow>=10.3",
    "aiogram>=3.4",
    "python-dotenv>=1.0",
    "mcp>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
carouselai-bot = "carouselai.bot.main:main"
carouselai-mcp = "carouselai.mcp_server.server:main"
carouselai-web = "carouselai.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carouselai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
